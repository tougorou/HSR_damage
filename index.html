<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>崩壊：スターレイル ダメージ計算ツール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>崩壊：スターレイル ダメージ計算機</h1>

    <!-- メインアタッカー設定 -->
    <section class="card">
      <h2>メインアタッカー設定</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>キャラクター:</label>
          <select id="main-char-select"></select>
        </div>
        <div class="form-group">
          <label>レベル:</label>
          <select id="main-char-level">
            <option value="80">Lv.80</option>
            <option value="70">Lv.70</option>
          </select>
        </div>
        <div class="form-group">
          <label>星魂（凸数）:</label>
          <select id="main-char-eidolon"></select>
        </div>
        <div class="form-group">
          <label>光円錐:</label>
          <select id="main-lc-select"></select>
        </div>
        <div class="form-group">
          <label>重畳ランク:</label>
          <select id="main-lc-rank">
            <option value="S1">S1</option>
            <option value="S2">S2</option>
            <option value="S3">S3</option>
            <option value="S4">S4</option>
            <option value="S5">S5</option>
          </select>
        </div>
        <div class="form-group">
          <label>トンネル遺物:</label>
          <select id="main-relic-select"></select>
        </div>
        <div class="form-group">
          <label>次元オーナメント:</label>
          <select id="main-ornament-select"></select>
        </div>
      </div>

      <h3>アタッカー追加サブステータス（遺物伸び幅など）</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>攻撃力％ (+%):</label>
          <input type="number" id="sub-atk-percent" value="0" step="0.1">
        </div>
        <div class="form-group">
          <label>攻撃力実数値 (+):</label>
          <input type="number" id="sub-atk-flat" value="0">
        </div>
        <div class="form-group">
          <label>会心率 (+%):</label>
          <input type="number" id="sub-crit-rate" value="0" step="0.1">
        </div>
        <div class="form-group">
          <label>会心ダメージ (+%):</label>
          <input type="number" id="sub-crit-dmg" value="0" step="0.1">
        </div>
        <div class="form-group">
          <label>与ダメージUP (+%):</label>
          <input type="number" id="sub-dmg-percent" value="0" step="0.1">
        </div>
      </div>

      <h3>自己バフ・状態有効化</h3>
      <div id="main-self-buffs" class="checkbox-group"></div>
    </section>

    <!-- サポートキャラ（パーティ編成）設定 -->
    <section class="card">
      <h2>パーティ編成（サポートキャラ編集）</h2>
      <div id="party-members-container">
        <!-- サポート1〜3が動的に生成されます -->
      </div>
    </section>

    <!-- 計算実行・結果表示 -->
    <section class="card result-card">
      <h2>計算結果</h2>
      <button id="calc-btn" class="btn-primary">ダメージ計算実行</button>

      <div class="result-display">
        <div class="stat-box">
          <h3>アタッカー実数値ステータス</h3>
          <p>最終攻撃力: <span id="res-total-atk">0</span></p>
          <p>会心率: <span id="res-crit-rate">0</span>%</p>
          <p>会心ダメージ: <span id="res-crit-dmg">0</span>%</p>
          <p>与ダメージ補正: <span id="res-dmg-boost">0</span>%</p>
        </div>

        <div class="damage-box">
          <h3>想定ダメージ</h3>
          <table class="damage-table">
            <thead>
              <tr>
                <th>攻撃種類</th>
                <th>通常ダメージ</th>
                <th>会心ダメージ</th>
                <th>期待値</th>
              </tr>
            </thead>
            <tbody id="damage-results-body">
              <tr><td colspan="4">計算ボタンを押してください</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
