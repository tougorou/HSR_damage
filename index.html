<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>崩壊：スターレイル ダメージ計算機</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- トップバー -->
  <header class="topbar">
    <div>
      <div class="logo">HSR DAMAGE CALCULATOR</div>
      <div class="sub">崩壊：スターレイル ダメージシミュレーター</div>
    </div>
    <div class="top-actions">
      <button id="saveBtn">設定保存</button>
      <button id="loadBtn">設定読込</button>
      <button id="resetBtn">リセット</button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="app">

    <!-- 左サイドバー：キャラ＆光円錐・バフ設定 -->
    <aside class="sidebar">

      <!-- キャラクター設定 -->
      <section class="card">
        <h2>キャラクター設定</h2>
        <label>
          キャラクター
          <select id="characterSelect"></select>
        </label>
        
        <div class="row">
          <label>
            レベル
            <select id="charLevel">
              <option value="80" selected>Lv 80</option>
              <option value="70">Lv 70</option>
            </select>
          </label>
          <label>
            星魂 (凸数)
            <select id="eidolonSelect"></select>
          </label>
        </div>

        <!-- 自己バフ表示エリア -->
        <div style="margin-top: 10px;">
          <span style="font-size: 11px; color: var(--muted); display: block; margin-bottom: 5px;">キャラクター固有バフ</span>
          <div id="selfBuffsContainer"></div>
        </div>
      </section>

      <!-- 攻撃・スキル設定 -->
      <section class="card">
        <h2>攻撃スキル設定</h2>
        <label>
          使用スキル
          <select id="attackSelect"></select>
        </label>
        <div class="row">
          <label>
            スキル倍率 (%)
            <input type="number" id="multiplier" value="100" step="0.1">
          </label>
          <label>
            ヒット数
            <input type="number" id="hits" value="1" min="1">
          </label>
        </div>
        <label>
          固定加算ダメージ
          <input type="number" id="flatDamage" value="0">
        </label>
      </section>

      <!-- 光円錐設定 -->
      <section class="card">
        <h2>光円錐設定</h2>
        <label>
          光円錐
          <select id="lightConeSelect"></select>
        </label>
        <div class="row">
          <label>
            レベル
            <select id="coneLevel">
              <option value="80" selected>Lv 80</option>
              <option value="70">Lv 70</option>
            </select>
          </label>
          <label>
            重畳ランク
            <select id="coneSuper">
              <option value="S1" selected>重畳 1</option>
              <option value="S2">重畳 2</option>
              <option value="S3">重畳 3</option>
              <option value="S4">重畳 4</option>
              <option value="S5">重畳 5</option>
            </select>
          </label>
        </div>
      </section>

    </aside>

    <!-- 中央エリア：計算結果＆メイン数値 -->
    <div class="center">
      <section class="card hero">
        <div class="hero-title">
          <span>計算結果</span>
          <div>
            <span id="resultCharacter">-</span>
            <span class="badge" id="resultElement">-</span>
          </div>
        </div>

        <div class="damage-number" id="damage">0</div>
        <div class="damage-caption">想定期待ダメージ（<span id="resultAttack">-</span>）</div>

        <div class="quick-stats">
          <div>
            <span>会心係数</span>
            <b id="qCrit">1.0000</b>
          </div>
          <div>
            <span>与ダメ係数</span>
            <b id="qDmg">1.0000</b>
          </div>
          <div>
            <span>防御係数</span>
            <b id="qDef">1.0000</b>
          </div>
          <div>
            <span>耐性係数</span>
            <b id="qRes">1.0000</b>
          </div>
        </div>
      </section>

      <!-- 計算内訳詳細 -->
      <section class="card">
        <h2>ダメージ詳細内訳</h2>
        <div class="breakdown" id="breakdown">
          <!-- JSで自動描画 -->
        </div>
      </section>

      <!-- パーティー編成枠 -->
      <section class="card">
        <h2>パーティー構成</h2>
        <div class="party-grid">
          <div class="party-slot main">
            <span id="partyMain">メインアタッカー</span>
          </div>
          <div class="party-slot">
            <span>サブ / サポート 1</span>
            <input type="text" placeholder="名前">
          </div>
          <div class="party-slot">
            <span>サブ / サポート 2</span>
            <input type="text" placeholder="名前">
          </div>
          <div class="party-slot">
            <span>耐久 / サポート 3</span>
            <input type="text" placeholder="名前">
          </div>
        </div>
      </section>
    </div>

    <!-- 右サイドバー：詳細ステータス・バフ・敵設定 -->
    <aside class="rightbar">

      <!-- ステータス設定 -->
      <section class="card">
        <h2>キャラクター基本ステータス</h2>
        <div class="row">
          <label>
            基礎攻撃力
            <input type="number" id="atk" value="0">
          </label>
          <label>
            攻撃力% (遺物)
            <input type="number" id="relicAtk" value="0" step="0.1">
          </label>
        </div>
        <div class="row">
          <label>
            攻撃力バフ (%)
            <input type="number" id="buffAtk" value="0" step="0.1">
          </label>
          <label>
            攻撃力実数値
            <input type="number" id="flatAtk" value="0">
          </label>
        </div>
        <div class="row">
          <label>
            会心率 (%)
            <input type="number" id="critRate" value="5" step="0.1">
          </label>
          <label>
            会心ダメージ (%)
            <input type="number" id="critDmg" value="50" step="0.1">
          </label>
        </div>
        <div class="row">
          <label>
            会心バフ (%)
            <input type="number" id="buffCrit" value="0" step="0.1">
          </label>
          <label>
            会心ダメバフ (%)
            <input type="number" id="buffCritDmg" value="0" step="0.1">
          </label>
        </div>
        <div class="row">
          <label>
            属性与ダメージ (%)
            <input type="number" id="elementDmg" value="0" step="0.1">
          </label>
          <label>
            与ダメージバフ (%)
            <input type="number" id="buffDmg" value="0" step="0.1">
          </label>
        </div>
        <label>
          会心判定モード
          <select id="critMode">
            <option value="average" selected>期待値 (会心率×会心ダメ)</option>
            <option value="crit">会心発生時</option>
            <option value="noncrit">非会心時</option>
          </select>
        </label>
      </section>

      <!-- 敵ステータス設定 -->
      <section class="card">
        <h2>ターゲット (敵) 設定</h2>
        <div class="row">
          <label>
            敵レベル
            <input type="number" id="enemyLevel" value="95">
          </label>
          <label>
            属性耐性 (%)
            <input type="number" id="resistance" value="20" step="1">
          </label>
        </div>
        <div class="row">
          <label>
            防御ダウン (%)
            <input type="number" id="defDown" value="0" step="0.1">
          </label>
          <label>
            防御無視 (%)
            <input type="number" id="defIgnore" value="0" step="0.1">
          </label>
        </div>
        <div class="row">
          <label>
            耐性貫通 (%)
            <input type="number" id="resPen" value="0" step="0.1">
          </label>
          <label>
            被ダメージUP (%)
            <input type="number" id="takenUp" value="0" step="0.1">
          </label>
        </div>
        <label>
          弱点撃破状態
          <select id="broken">
            <option value="0.9" selected>通常状態 (10%軽減)</option>
            <option value="1">弱点撃破中 (軽減なし)</option>
          </select>
        </label>
      </section>

    </aside>

  </main>

  <footer>
    <p>Honkai: Star Rail Damage Calculator</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
